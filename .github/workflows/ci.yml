name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  frontend:
    name: Frontend (Build & Lint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Build frontend
        run: npm run build

  backend:
    name: Backend (Syntax & Module Validation)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Validate backend syntax
        working-directory: backend
        run: |
          node --check server.js
          for file in middleware/*.js models/*.js routes/*.js; do
            [ -f "$file" ] && node --check "$file"
          done
          echo "All backend JavaScript files passed syntax verification."

      - name: Validate backend module resolution
        working-directory: backend
        run: node -e "require('./middleware/auth'); require('./models/User'); require('./models/Event'); require('./models/Opportunity'); require('./models/Partnership'); require('./models/Request'); require('./routes/authRoutes'); require('./routes/eventRoutes'); require('./routes/opportunityRoutes'); require('./routes/partnershipRoutes'); require('./routes/requestRoutes'); console.log('Backend routes, models, and middleware loaded and validated successfully.');"
