services:
  backend:
    build:
      context: ./backend
    container_name: sponnect-backend
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    environment:
      PORT: 5000
    restart: unless-stopped

  frontend:
    build:
      context: .
      args:
        VITE_API_URL: http://localhost:5000/api
    container_name: sponnect-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped
